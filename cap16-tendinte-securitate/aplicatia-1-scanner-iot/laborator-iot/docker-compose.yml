# Laborator IoT simulat: toate serviciile ascultă DOAR pe 127.0.0.1.
# Configurațiile sunt INTENȚIONAT nesigure. Nu expuneți aceste
# containere în rețea.
services:
  camera-telnet:            # cameră IP cu Telnet activ
    image: busybox:1.37
    command: telnetd -F -p 23 -l /bin/login
    ports: ["127.0.0.1:2323:23"]

  router-web:               # panou web cu credențiale implicite
    image: nginx:1.30-alpine
    configs:
      - source: router-site
        target: /etc/nginx/conf.d/default.conf
      - source: router-parole
        target: /etc/nginx/htpasswd
    ports: ["127.0.0.1:8080:80"]

  broker-deschis:           # MQTT care acceptă clienți anonimi
    image: eclipse-mosquitto:2.0
    configs:
      - source: mqtt-deschis
        target: /mosquitto/config/mosquitto.conf
    ports: ["127.0.0.1:1883:1883"]

  broker-securizat:         # MQTT care refuză clienții anonimi
    image: eclipse-mosquitto:2.0
    configs:
      - source: mqtt-securizat
        target: /mosquitto/config/mosquitto.conf
    ports: ["127.0.0.1:1884:1883"]

configs:
  router-site:
    content: |
      server {
        listen 80;
        location / {
          auth_basic "Router IoT";
          auth_basic_user_file /etc/nginx/htpasswd;
          root /usr/share/nginx/html;
        }
      }
  router-parole:
    content: |
      admin:{PLAIN}admin
  mqtt-deschis:
    content: |
      listener 1883
      allow_anonymous true
  mqtt-securizat:
    content: |
      listener 1883
      allow_anonymous false
